name: device-test-check-proof

on:
  push:
    branches: [proof/device-test-check]

permissions:
  checks: write
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        run: ['true', 'false']
    runs-on: ubuntu-26.04
    steps:
      - name: Should we run this device test?
        if: matrix.run == 'true'
        run:
          echo "run_device_test=true" >> "$GITHUB_ENV"

      - uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        id: create_check
        with:
          token: ${{ github.token }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status: ${{ env.run_device_test == 'true' && 'in_progress' || 'completed' }}
          conclusion: ${{ env.run_device_test != 'true' && 'success' || '' }}
          name: proof run_device_test=${{ matrix.run }}
          sha: ${{ github.sha }}

      - name: Stand-in for the Device Farm run
        if: env.run_device_test == 'true'
        run: sleep 30

      - name: Stand-in for the second token
        if: always() && env.run_device_test == 'true'
        run: echo "second token step ran"

      - uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        if: always() && env.run_device_test == 'true'
        with:
          token: ${{ github.token }}
          check_id: ${{ steps.create_check.outputs.check_id }}
          conclusion: ${{ job.status }}
